name: Raccolta Trenord

on:
  schedule:
    # Ogni mezz'ora (orario UTC; GitHub può partire con qualche minuto di ritardo)
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Mai due raccolte insieme: raddoppierebbero le richieste al sito
concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: Raccoglie i dati
        run: python trenord_scraper.py collect --archivio archivio

      - name: Salva i dati nel repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archivio
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo."
          else
            git commit --quiet -m "Dati $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
            git push
          fi
